version: "3.9"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - migrate
    ports:
      - "27017:27017"

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    depends_on:
      - mongo
    restart: unless-stopped
    networks:
      - migrate
    ports:
      - "8001:8001"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - migrate
    ports:
      - "3000:80"

volumes:
  mongo_data:

networks:
  migrate:
